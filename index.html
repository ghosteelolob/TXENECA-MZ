<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Tcheneca</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
}

/* MENU */
nav {
    display: flex;
    justify-content: center;
    gap: 25px;
    background: #111;
    padding: 12px;
}
nav a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
}

/* TÍTULO */
header {
    text-align: center;
    padding: 30px 15px;
}
header h1 {
    font-size: 40px;
    color: #0a7cff;
}

/* SEÇÕES */
section {
    background: #fff;
    margin: 20px auto;
    padding: 20px;
    width: 95%;
    max-width: 900px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* FORMULÁRIOS */
input, select, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}
button {
    background: #0a7cff;
    color: #fff;
    border: none;
    font-size: 16px;
}

/* QUADRADOS */
.boxes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
    gap: 15px;
}
.box {
    background: #0a7cff;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    font-weight: bold;
}

/* LISTA */
.listas {
    display: flex;
    justify-content: space-between;
}
ul {
    list-style: none;
    padding: 0;
}

/* SLIDER */
.slider-value {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-top: 10px;
}

/* DISCURSO */
.discurso {
    background: #eef5ff;
    padding: 15px;
    border-left: 5px solid #0a7cff;
    margin: 10px 0;
}

/* MENSAGEM FLUTUANTE */
#floating {
    position: fixed;
    top: 20px;
    right: -300px;
    background: #0a7cff;
    color: #fff;
    padding: 12px 18px;
    border-radius: 8px;
    animation: move 8s infinite;
}

@keyframes move {
    0% { right: -300px; top: 20px; }
    30% { right: 20px; top: 20px; }
    60% { right: 20px; top: 80%; }
    100% { right: -300px; top: 80%; }
}
</style>
</head>

<body>

<div id="floating">Joana recebeu 5.000 MZN agora</div>

<nav>
<a href="#">Início</a>
<a href="#">Empréstimos</a>
<a href="#">Pagamentos</a>
</nav>

<header>
<h1>TCHENECA</h1>
</header>

<section>
<h2>Cadastro</h2>
<input placeholder="Nome completo">
<input placeholder="Telefone">
<input placeholder="Número da casa">
<select>
<option>Género</option>
<option>Masculino</option>
<option>Feminino</option>
</select>
<input placeholder="Província">
<button>Cadastrar</button>
</section>

<section class="boxes">
<div class="box">Flexibilidade</div
