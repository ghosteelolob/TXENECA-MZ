<!DOCTYPE html><html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXENECA MZ - ULTRA FINAL</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:white;}
.container{max-width:1300px;margin:auto;padding:20px;}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 0 20px rgba(0,0,0,0.4);animation:fadeIn 0.6s;}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:15px;}
button{background:#22c55e;border:none;padding:12px;width:100%;border-radius:8px;font-size:16px;cursor:pointer;color:white;transition:0.3s;}
button:hover{background:#16a34a;transform:scale(1.02);}
.progress{height:8px;background:#334155;border-radius:10px;overflow:hidden;margin-bottom:20px;}
.progress-bar{height:8px;width:0%;background:#22c55e;transition:0.4s;}
.slider-value{text-align:center;font-size:20px;margin:10px 0;}
.toast{position:fixed;bottom:20px;right:20px;background:#22c55e;padding:15px;border-radius:8px;display:none;animation:slideUp 0.5s;z-index:9999;}
.loader{text-align:center;margin-top:15px;display:none;}
.spinner{border:4px solid #ccc;border-top:4px solid #22c55e;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:auto;}
@keyframes spin{100%{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.preview{width:100%;margin-top:10px;border-radius:8px;}
.hidden{display:none;}
.status-process{color:#facc15;font-weight:bold;}
ul li.processando{color:#facc15;}
ul li.finalizado{color:#22c55e;}
</style>
</head>
<body>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="card" id="cadastroCard">

<select id="idade" onchange="updateProgress()"><option value="">Idade</option></select>
<select id="sexo" onchange="updateProgress()"><option value="">Sexo</option><option>Masculino</option><option>Feminino</option></select>
<select id="provincia" onchange="updateProgress()"><option value="">Província</option><option>Maputo</option><option>Gaza</option><option>Inhambane</option><option>Sofala</option><option>Manica</option><option>Tete</option><option>Zambézia</option><option>Nampula</option><option>Cabo Delgado</option><option>Niassa</option></select>
<input type="text" id="casa" placeholder="Número da Casa" oninput="updateProgress()">
<input type="email" id="email" placeholder="Email" oninput="updateProgress()">
<input type="tel" id="telefone" placeholder="Telefone" oninput="updateProgress()">
<select id="profissao" onchange="updateProgress()"><option value="">Profissão</option><option>Desempregado</option><option>Empresário</option><option>Professor</option><option>Motorista</option><option>Enfermeiro</option><option>Comerciante</option><option>Agricultor</option><option>Programador</option><option>Médico</option><option>Polícia</option><option>Advogado</option><option>Engenheiro</option><option>Vendedor</option><option>Outro</option></select>
<h4>Upload BI Frente</h4><input type="file" accept="image/*" onchange="previewImage(event,'img1')"><img id="img1" class="preview">
<h4>Upload BI Verso</h4><input type="file" accept="image/*" onchange="previewImage(event,'img2')"><img id="img2" class="preview">
<button onclick="finalizarCadastro()">Finalizar Cadastro</button>
