<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXENECA MZ - Empréstimos e Cadastro</title>
<style>
    /* RESET BÁSICO */
    * {margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
    body {background-color:#0a0a0a; color:#fff;}
    a {text-decoration:none; color:#00f;}
    button {cursor:pointer;}

    /* CONTAINER PRINCIPAL */
    .container {max-width:1200px; margin:20px auto; padding:20px;}

    /* CABEÇALHO */
    header {display:flex; justify-content:space-between; align-items:center; padding:20px 0;}
    header h1 {color:#00bfff; font-size:2rem;}
    header nav a {margin-left:20px; color:#fff; font-weight:bold;}

    /* FORMULÁRIO */
    form {background:#111; padding:20px; border-radius:12px; margin-bottom:30px;}
    form h2 {color:#00bfff; margin-bottom:15px;}
    form input, form select {width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none;}
    form input[type="file"] {padding:3px;}
    form button {background:#00bfff; color:#000; font-weight:bold; border:none; padding:12px 20px; border-radius:8px; transition:0.3s;}
    form button:hover {background:#009acd; color:#fff;}

    /* SEÇÃO DE TAXAS */
    .taxas {display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; margin-bottom:30px;}
    .card {background:#111; padding:20px; border-radius:12px; position:relative; border:1px solid #222;}
    .card h3 {color:#00bfff; margin-bottom:10px;}
    .card .valor {font-size:1.8rem; font-weight:bold; color:#ffd700;}
    .card .selo {position:absolute; top:10px; right:10px; background:#28a745; color:#fff; padding:5px 10px; border-radius:6px; font-size:0.9rem;}
    .card .mais-aderido {position:absolute; top:35px; right:10px; background:#ff4500; color:#fff; padding:5px 10px; border-radius:6px; font-size:0.8rem;}

    /* SLIDER */
    .slider-container {margin-bottom:30px;}
    .slider-container input[type="range"] {width:100%;}
    .slider-value {text-align:center; font-size:1.5rem; margin-top:10px; color:#00bfff;}

    /* BOTÃO FLUTUANTE */
    .float-btn {position:fixed; bottom:20px; right:20px; background:#00bfff; color:#000; border:none; padding:15px 20px; border-radius:50px; font-weight:bold; box-shadow:0 5px 15px rgba(0,0,0,0.3); z-index:1000; transition:0.3s;}
    .float-btn:hover {background:#009acd; color:#fff;}

    /* FOOTER */
    footer {text-align:center; padding:20px; border-top:1px solid #222; color:#888;}
</style>
</head>
<body>

<div class="container">

    <!-- CABEÇALHO -->
    <header>
        <h1>TXENECA MZ</h1>
        <nav>
            <a href="#cadastro">Cadastro</a>
            <a href="#taxas">Taxas</a>
            <a href="#slider">Simulador</a>
        </nav>
    </header>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="cadastro">
        <h2>Cadastro Completo</h2>
        <input type="text" placeholder="Nome Completo" required>
        <input type="text" placeholder="Número de Telefone" required>
        <input type="email" placeholder="Email" required>
        <select required>
            <option value="">Escolha a sua cidade</option>
            <option>Maputo</option>
            <option>Matola</option>
            <option>Beira</option>
            <option>Nampula</option>
        </select>
        <input type="file" accept="image/*" required>
        <input type="file" accept="image/*" required>
        <button type="submit">Enviar Cadastro</button>
    </form>

    <!-- SEÇÃO DE TAXAS DE INSCRIÇÃO -->
    <section class="taxas" id="taxas">
        <div class="card">
            <h3>Inscrição Inicial</h3>
            <div class="valor">MZN 199</div>
            <div class="selo">Verificado</div>
            <div class="mais-aderido">Mais Aderido</div>
        </div>
        <div class="card">
            <h3>Inscrição Média</h3>
            <div class="valor">MZN 299</div>
            <div class="selo">Verificado</div>
        </div>
        <div class="card">
            <h3>Inscrição Premium</h3>
            <div class="valor">MZN 399</div>
            <div class="selo">Verificado</div>
        </div>
    </section>

    <!-- SLIDER DE SIMULAÇÃO -->
    <div class="slider-container" id="slider">
        <h2>Simulador de Pagamento</h2>
        <input type="range" min="100" max="10000" step="50" value="500" id="sliderRange">
        <div class="slider-value">Valor Selecionado: MZN <span id="sliderOutput">500</span></div>
    </div>
</div>

<!-- BOTÃO FLUTUANTE -->
<button class="float-btn">Ajuda / Contato</button>

<!-- FOOTER -->
<footer>
    TXENECA MZ &copy; 2026 - Todos os direitos reservados
</footer>

<script>
    // Atualiza valor do slider em tempo real
    const slider = document.getElementById('sliderRange');
    const output = document.getElementById('sliderOutput');
    slider.oninput = function() { output.innerText = this.value; }

    // Placeholder para envio do formulário
    document.querySelector('form').addEventListener('submit', function(e){
        e.preventDefault();
        alert('Cadastro enviado com sucesso!');
    });
</script>

</body>
  </html>
