<!DOCTYPE html><html lang="pt">
<head>

<title>Txuna M-Pesa PRO</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f172a;color:#fff}

header{
background:linear-gradient(135deg,#00a859,#007a43);
padding:20px;
text-align:center;
}

.hero{
padding:40px 20px;
text-align:center;
animation:fadeIn 1s ease;
}

.hero h1{font-size:28px}
.hero p{opacity:0.8;margin:10px 0}

.btn{
background:#00ff88;
border:none;
padding:15px 25px;
border-radius:30px;
color:#000;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.btn:hover{transform:scale(1.05)}

.container{padding:20px}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
animation:slideUp 0.8s ease;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-top:10px;
}

.slider{
display:flex;
overflow-x:auto;
gap:15px;
padding:20px;
}

.slide{
min-width:250px;
background:linear-gradient(135deg,#00a859,#00ff88);
color:#000;
padding:20px;
border-radius:20px;
font-weight:bold;
}

.toast{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#00ff88;
color:#000;
padding:10px 20px;
border-radius:20px;
display:none;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:18px;
border-radius:50%;
font-size:20px;
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

@keyframes slideUp{
from{transform:translateY(40px);opacity:0}
to{transform:translateY(0);opacity:1}
}
