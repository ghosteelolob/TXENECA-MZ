<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Txuna Finance</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#f4f6f9;}

/* NAVBAR */
.nav{
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
  background:white;
  align-items:center;
}

.logo{font-weight:bold;font-size:22px;color:#0f172a;}
.logo span{color:#22c55e;}

.nav button{
  background:#0f172a;
  color:white;
  padding:10px 15px;
  border:none;
  border-radius:8px;
}

/* HERO */
.hero{
  display:flex;
  justify-content:space-between;
  padding:60px 40px;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:white;
}

.hero h1{font-size:42px;margin-bottom:15px;}
.hero p{margin-bottom:20px;}

.hero .btns button{
  margin-right:10px;
  padding:12px 18px;
  border-radius:8px;
  border:none;
}

.green{background:#22c55e;color:white;}
.white{background:white;color:black;}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  background:white;
  margin:20px;
  padding:20px;
  border-radius:12px;
}

/* DASHBOARD */
.main{
  display:flex;
  padding:20px;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#0f172a;
  color:white;
  padding:20px;
  border-radius:12px;
}

.sidebar img{width:70px;border-radius:50%;}

.sidebar a{
  display:block;
  margin:12px 0;
  color:white;
  text-decoration:none;
}

/* CONTENT */
.content{
  flex:1;
  margin-left:20px;
}

.cards{
  display:flex;
  gap:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  flex:1;
}

/* FORM */
input, select{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{
  cursor:pointer;
}

/* TRANSAÇÕES */
.trans{
  max-height:200px;
  overflow:auto;
}

</style>

</head>

<body>

<div class="nav">
  <div class="logo">Txuna <span>Finance</span></div>
  <button onclick="login()">Área do Cliente</button>
</div>

<div class="hero">
  <div>
    <h1>Poupe hoje, conquiste seus sonhos amanhã</h1>
    <p>Plataforma de poupança e empréstimos simulados.</p>
    <div class="btns">
      <button class="green">Começar</button>
      <button class="white">Saiba Mais</button>
    </div>
  </div>
</div>

<div class="stats">
  <div>1,245+ Clientes</div>
  <div>2,450,000+ Poupanças</div>
  <div>980,000+ Empréstimos</div>
  <div>98% Satisfação</div>
</div>

<div class="main">

<div class="sidebar">
  <img src="https://i.pravatar.cc/100">
  <h3 id="nomeUser">Visitante</h3>

  <a href="#">Dashboard</a>
  <a href="#">Poupança</a>
  <a href="#">Empréstimos</a>
</div>

<div class="content">

<div class="cards">
  <div class="card">
    <h3>Saldo</h3>
    <p id="saldo">0 MZN</p>
  </div>

  <div class="card">
    <h3>Dívida</h3>
    <p id="divida">0 MZN</p>
  </div>

  <div class="card">
    <h3>Última</h3>
    <p id="ultima">---</p>
  </div>
</div>

<br>

<div class="cards">

<div class="card">
  <h3>Depositar</h3>
  <input type="number" id="dep">
  <button class="green" onclick="depositar()">Confirmar</button>
</div>

<div class="card">
  <h3>Empréstimo</h3>
  <input type="number" id="emp">
  <button onclick="emprestar()">Solicitar</button>
</div>

<div class="card trans">
  <h3>Transações</h3>
  <ul id="hist"></ul>
</div>

</div>

</div>

</div>

<script>

let user = null;

/* LOGIN SIMPLES */
function login(){
  let nome = prompt("Seu nome:");

  if(!nome) return;

  let data = localStorage.getItem(nome);

  if(data){
    user = JSON.parse(data);
  }else{
    user = {nome, saldo:0, divida:0, hist:[]};
  }

  document.getElementById("nomeUser").innerText = user.nome;
  salvar();
  update();
}

function salvar(){
  localStorage.setItem(user.nome, JSON.stringify(user));
}

function update(){
  document.getElementById("saldo").innerText = user.saldo + " MZN";
  document.getElementById("divida").innerText = user.divida + " MZN";

  let h = document.getElementById("hist");
  h.innerHTML="";

  user.hist.slice().reverse().forEach(t=>{
    let li=document.createElement("li");
    li.innerText=t;
    h.appendChild(li);
  });

  if(user.hist.length){
    document.getElementById("ultima").innerText = user.hist[user.hist.length-1];
  }
}

/* AÇÕES */
function depositar(){
  if(!user) return alert("Faça login");

  let v = Number(document.getElementById("dep").value);

  if(v<=0) return;

  user.saldo += v;
  user.hist.push("Depósito +" + v);

  salvar();
  update();
}

function emprestar(){
  if(!user) return alert("Faça login");

  let v = Number(document.getElementById("emp").value);

  if(v<=0) return;

  let limite = user.saldo * 2;

  if(v > limite){
    return alert("Limite excedido");
  }

  user.hist.push("Pedido de empréstimo (em análise)");

  update();

  setTimeout(()=>{
    user.saldo += v;
    user.divida += v;
    user.hist.push("Empréstimo aprovado +" + v);

    salvar();
    update();
  },2000);
}

</script>

</body>
  </html>
